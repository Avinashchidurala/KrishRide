<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E55A2B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4A21;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Base gradient background -->
  <rect width="1920" height="600" fill="url(#heroGradient)"/>
  
  <!-- Grid pattern overlay -->
  <rect width="1920" height="600" fill="url(#gridPattern)"/>
  
  <!-- Overlay gradient for depth -->
  <rect width="1920" height="600" fill="url(#overlayGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="100" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1720" cy="450" r="150" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="960" cy="300" r="200" fill="#FFFFFF" opacity="0.03"/>
</svg>

